{% extends "layout.html" %}
{% block content %}

<section class="panel">
    <h2>Edit Expense #{{ expense.expense_id }}</h2>
    <form method="post" action="{{ url_for('edit', expense_id=expense.expense_id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Amount <input type="number" step="0.01" name="amount" value="{{ values.get('amount', expense.amount) }}" required></label>
        <label>Category
            <input list="category-list" name="category" value="{{ values.get('category', expense.category) }}">
            <datalist id="category-list">
                {% for c in categories %}<option value="{{ c }}">{% endfor %}
            </datalist>
        </label>
        <label>Description <input type="text" name="description" value="{{ values.get('description', expense.description) }}"></label>
        <label>Date <input type="date" name="date" value="{{ values.get('date', expense.date) }}" required></label>
        <button type="submit">Save Changes</button>
    </form>
    <p>
        <a href="{{ url_for('edit_history', expense_id=expense.expense_id) }}">View edit history</a>
        &middot; <a href="{{ url_for('index') }}">&larr; Back to expenses</a>
    </p>
</section>

{% endblock %}
